<script>
var DEALS = JSON.parse(document.getElementById('deals-data').textContent);
var state = {tab:'latest', cat:'', q:'', sort:'heat'};
var NOW = new Date();
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function href(u){try{return encodeURI(u);}catch(e){return u;}}
function cd(dl){
  if(!dl) return '';
  var end = new Date(dl + 'T23:59:59+08:00');
  var days = Math.ceil((end - NOW) / 86400000);
  if(days < 0) return '<span class="deadline">已截止（' + esc(dl) + '）</span>';
  if(days === 0) return '<span class="deadline">今天截止</span>';
  if(days === 1) return '<span class="deadline">剩 1 天 · ' + esc(dl) + '</span>';
  if(days <= 7) return '<span class="deadline">剩 ' + days + ' 天 · ' + esc(dl) + '</span>';
  return '<span class="deadline far">截止 ' + esc(dl) + '（剩 ' + days + ' 天）</span>';
}
function card(d){
  var h = '<article class="card">';
  h += '<h3><a href="' + href(d.u) + '" target="_blank" rel="noopener">' + esc(d.t) + '</a></h3>';
  h += '<div class="meta"><span class="tag">' + esc(d.c) + '</span>';
  h += '<span class="badge ' + (d.v === '已核实' ? 'ok' : 'no') + '">' + (d.v === '已核实' ? '已核实' : '待核实') + '</span>';
  if(d.m) h += '<span class="merchant">' + esc(d.m) + '</span>';
  h += '</div>';
  if(d.p) h += '<div class="price">' + esc(d.p) + '</div>';
  if(d.vt) h += '<div class="value">' + esc(d.vt) + '</div>';
  if(d.d) h += '<div class="discount">' + esc(d.d) + '</div>';
  if(d.op) h += '<div class="kv">原价：' + esc(d.op) + '</div>';
  if(d.dl) h += '<div>' + cd(d.dl) + '</div>';
  if(d.cond) h += '<div class="kv"><b>条件：</b>' + esc(d.cond) + '</div>';
  if(d.st) h += '<div class="kv"><b>步骤：</b>' + esc(d.st) + '</div>';
  if(d.r) h += '<div class="risk">⚠ ' + esc(d.r) + '</div>';
  if(d.cc) h += '<div class="code">优惠码：<code>' + esc(d.cc) + '</code></div>';
  h += '<div class="src"><span>来源：' + esc(d.sn || d.u) + (d.fs ? ' · ' + esc(d.fs) : '') + '</span>';
  h += '<a class="btn" href="' + href(d.u) + '" target="_blank" rel="noopener">去来源页 ↗</a></div>';
  h += '</article>';
  return h;
}
function filtered(){
  var list = DEALS.filter(function(d){
    var active = (d.s || 'active') === 'active';
    if(state.tab === 'expired'){ if(active) return false; }
    else { if(!active) return false;
      if(state.tab === 'value' && (d.vs || 0) < 70) return false;
      if(state.tab === 'ending' && !d.dl) return false;
    }
    if(state.cat && d.c !== state.cat) return false;
    if(state.q){
      var hay = [d.t, d.m, d.p, d.vt, d.d, d.cond, d.st, d.sn, d.c].join(' ').toLowerCase();
      if(hay.indexOf(state.q) < 0) return false;
    }
    return true;
  });
  var s = state.sort;
  list.sort(function(a, b){
    if(s === 'heat') return (b.h || 50) - (a.h || 50);
    if(s === 'value') return (b.vs || 0) - (a.vs || 0);
    if(s === 'new') return String(b.fs || '').localeCompare(String(a.fs || ''));
    if(s === 'deadline'){
      if(!a.dl && !b.dl) return 0;
      if(!a.dl) return 1;
      if(!b.dl) return -1;
      return String(a.dl).localeCompare(String(b.dl));
    }
    return 0;
  });
  return list;
}
function render(){
  var list = filtered();
  document.getElementById('grid').innerHTML = list.map(card).join('');
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('count').textContent = '共 ' + list.length + ' 条';
}
document.getElementById('q').addEventListener('input', function(e){ state.q = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on'); state.cat = b.getAttribute('data-cat'); render();
});
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on'); state.tab = b.getAttribute('data-tab'); render();
});
document.getElementById('sort').addEventListener('change', function(e){ state.sort = e.target.value; render(); });
render();
</script>
